services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
      - dev # Локальная БД только для разработки. В продакшене на client.cloudvps.by не используется.

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Для локальной разработки (profile: dev) используется локальная БД 'postgres'.
      # Для продакшена на client.cloudvps.by замените на:
      # DATABASE_URL: postgresql://user:pass@client.cloudvps.by:5432/school_bot
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-school_bot}
      PGSSLMODE: disable # Для локального Docker. Для client.cloudvps.by установите 'require' в .env
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
